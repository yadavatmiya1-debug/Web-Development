<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <form action="server">
        <h1>Feedback Form</h1>
        <div>
            <label for="name">Name: </label>
            <input type="text" placeholder="Write your name" name="Name" id="name">
        </div>
        <br>

        <div>
            <label for="email id">Email: </label>
            <input type="text" placeholder="Write your email" name="email" id="email id">
        </div>
        <br>
        Message:
        <div>
            <textarea></textarea>
        </div>
        <br>

        Rate us out of 5:
        <div>
            <input type="radio" name="rate" id="hii">
            <label for="hii" >1</label>
            <br>
            <input type="radio" name="rate" id="by">
            <label for="by">2</label>
            <br>
            <input type="radio" name="rate" id="cy">
            <label for="cy">3</label>
            <br>
            <input type="radio" name="rate" id="sy">
            <label for="sy">4</label>
            <br>
            <input type="radio" name="rate" id="xy">
            <label for="xy">5</label>
        </div>
        <br>

        <button>Send your message!</button>




        
    </form>
    
</body>
</html>
