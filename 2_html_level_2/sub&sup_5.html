<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sup & Sub </title>
</head>
<p> Superscript and subscript </p>
<body>
    <h1>A<sup>2</sup></h1>
    <h1>H<sub>2</sub>O</h1>
    <h1>H<sub><u>2</u></sub>O</h1>
</body>
</html>
